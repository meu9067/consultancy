<!doctype html>
<html lang="{{htmlLang}}">
<head>
  {{> head title=siteTitle description=tagline canonicalPath="/"}}
  <link rel="alternate" hreflang="en" href="{{siteUrl}}/" />
  <link rel="alternate" hreflang="pt-PT" href="{{siteUrl}}/pt/" />
  <link rel="alternate" hreflang="x-default" href="{{siteUrl}}/" />

  <!-- Open Graph / Facebook, LinkedIn, etc. -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="{{siteTitle}}" />
  <meta property="og:description" content="{{tagline}}" />
  <meta property="og:url" content="{{siteUrl}}/" />
  <meta property="og:locale" content="{{ogLocale}}" />
  <meta property="og:site_name" content="{{name}}" />
  <meta property="og:image" content="{{siteUrl}}/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{socialImageAlt}}" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{siteTitle}}" />
  <meta name="twitter:description" content="{{tagline}}" />
  <meta name="twitter:image" content="{{siteUrl}}/og-image.jpg" />
  <meta name="twitter:image:alt" content="{{socialImageAlt}}" />

  <!-- Structured data for search engines and AI answer engines -->
  <script type="application/ld+json">{{{jsonLd}}}</script>

  {{> head-scripts}}
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <a class="skip-link" href="#main-content">{{skipLink}}</a>

  {{> nav enHref="/" ptHref="/pt/"}}

  <main id="main-content">
    {{> hero}}
    {{> about}}
    {{> laws}}
    {{> services}}
    {{> faq}}
    {{> contact}}
  </main>

  {{> footer}}

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
